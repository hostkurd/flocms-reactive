name: Tests

on:
  push:
    branches: [main, 'feature/**']
  pull_request:

permissions:
  contents: read

jobs:
  php:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v4
      # Explicit immutable checkout while Core 2.3.2 is awaiting release.
      # Remove this bridge once Composer can resolve the stable minimum.
      - uses: actions/checkout@v4
        with:
          repository: hostkurd/flocms-core
          ref: d4df0602fa8fb2401bcc72b5330bf2556c583f13
          path: .ci/core
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo_sqlite, json, zip
          coverage: none
      - run: composer validate --strict --no-check-lock
      - run: php scripts/use-core-checkout.php .ci/core
      - run: composer install --no-interaction --no-progress --prefer-dist
        env:
          COMPOSER: composer.local.json
      - run: find src tests examples bootstrap.php scripts -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null
      - run: vendor/bin/phpunit
      - run: composer archive --format=zip --dir=/tmp --file=flocms-reactive-distribution
      - run: php scripts/check-distribution.php /tmp/flocms-reactive-distribution.zip

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: hostkurd/flocms-core
          ref: d4df0602fa8fb2401bcc72b5330bf2556c583f13
          path: .ci/core
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, json
          coverage: none
      - run: php scripts/use-core-checkout.php .ci/core
      - run: composer install --no-interaction --no-progress --prefer-dist
        env:
          COMPOSER: composer.local.json
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - name: Verify release assets are reproducible
        run: git diff --exit-code -- dist && test -z "$(git ls-files --others --exclude-standard dist)"
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-results
          path: test-results/
